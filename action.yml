
name: GitHub City Skyline Generator
description: Generates a 3D isometric city from GitHub contributions.
author: Zain1024

inputs:
  github_token:
    description: Token used to read GitHub contribution data
    required: true
  theme:
    description: City theme, such as github or cityNight
    required: false
    default: cityNight

runs:
  using: composite
  steps:
    - name: Check Node.js
      shell: bash
      run: |
        node --version
        node -e "if (Number(process.versions.node.split('.')[0]) < 18) process.exit(1)"

    - name: Generate city
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_USERNAME: ${{ github.repository_owner }}
        THEME: ${{ inputs.theme }}
      run: node index.js

    - name: Copy generated city
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        ACTION_PATH: ${{ github.action_path }}
        WORKSPACE: ${{ github.workspace }}
      run: cp "$ACTION_PATH/city.svg" "$WORKSPACE/city.svg"
